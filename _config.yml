about_content: |
  Cloud & Automation Engineer. Presented at Red Hat Summit 2023 on deploying Ansible Automation Platform 2 in security-hardened AWS environments. Master of Information Technology, Virginia Tech (2019–2021).

content:
  - title: Presentations
    layout: list
    content:
      - layout: left
        border: weak
        title: Red Hat Summit 2023
        quote: >
          Lessons learned deploying Red Hat Ansible Automation Platform 2 in hardened cloud environments
        description: |
          Security-hardened cloud environments are common in defense, finance, healthcare, manufacturing, and other essential industries. But they pose challenges—including lack of internet access, hardened operating systems restrictions, and security restrictions—for deploying several of the new features of Ansible Automation Platform 2. In this session, we’ll explore tips, tricks, and lessons for resolving common challenges encountered in following the existing documentation, including recommendations for specific technical configurations for Amazon Web Services (AWS).
