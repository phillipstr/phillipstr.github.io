# Build settings
# The theme's layouts, includes, styles and favicon are NOT stored in this repo.
# They are pulled from GitHub at build time (GitHub Pages does this natively;
# locally it needs network access). To pin a version, use e.g.
# remote_theme: sproogen/modern-resume-theme@<tag-or-commit>
remote_theme: sproogen/modern-resume-theme

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - lib/
  - scripts/
  - docker-compose.yml
